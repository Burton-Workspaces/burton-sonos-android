# Conventional commits
#
# What: Rejects commit subjects (and pull request titles) that are not
#       Conventional Commits. release-please in release.yml uses those prefixes
#       to decide SemVer bumps (feat = minor, fix = patch, BREAKING = major).
# When: pull_request title edits/sync, and push to master.
# Does not: bump version.txt or open a release PR; that is release.yml.
#
# Steps:
#   1. actions/checkout@v4 (full history) — needed so --range can see commits
#   2. ./scripts/test-conventional-commit.sh — sanity-check the checker itself
#   3. PR: validate github.event.pull_request.title
#   4. PR: validate every commit from base..head
#   5. Push: validate every commit from before..sha
name: Conventional commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test
        run: ./scripts/test-conventional-commit.sh
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/conventional-commit.sh --subject "$TITLE"
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/conventional-commit.sh --range "$BASE" "$HEAD"
      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: ./scripts/conventional-commit.sh --range "$BEFORE" "$SHA"
