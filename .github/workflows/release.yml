# Semantic versioning via release-please (conventional commits).
# Merge the release PR to tag vX.Y.Z, create the GitHub Release, and attach the signed APK.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Release-please
    if: github.repository == 'rconnelly/burton-sonos-android'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-labeling: true

  pack:
    name: Pack release APK
    needs: release-please
    if: "${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != '' }}"
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
