# Release assets
#
# What: Builds a signed release APK and attaches burton-sonos-<version>.apk to
#       the GitHub Release for tag vX.Y.Z. Version comes from version.txt; the
#       tag without the leading v must match it.
# When:
#   - workflow_call from release.yml after release-please creates a tag
#   - push of a v*.*.* tag
#   - workflow_dispatch (manual retry: Actions → Release assets → Run workflow)
# Does not: decide the next SemVer. That is release.yml / release-please.
#
# Upload uses --clobber so a tag push and the release.yml pack job can both run.
#
# Steps:
#   1. Resolve the tag (workflow input, or GITHUB_REF_NAME on a tag push)
#   2. actions/checkout@v4 at that tag
#   3. Fail if tag (minus v) != version.txt
#   4. ./.github/actions/setup-android-ci — Temurin 17, Android SDK
#   5. ./gradlew testDebugUnitTest
#   6. Write release.jks + keystore.properties from repo secrets
#      KEYSTORE_BASE64, KEYSTORE_PASSWORD (required);
#      KEY_ALIAS / KEY_PASSWORD optional
#   7. ./gradlew assembleRelease
#   8. gh release create if needed, then gh release upload --clobber
#
# Local equivalent: ./scripts/upload-release-apk.sh 1.3.0
name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to pack (latest stable SemVer, for example vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to pack (latest stable SemVer, for example vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  github-release:
    name: Build and upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: echo "tag=${TAG_INPUT:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-tags: true
      - name: Verify tag matches version.txt
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual=$(tr -d '[:space:]' < version.txt)
          if [ "$expected" != "$actual" ]; then
            echo "Tag $TAG does not match version.txt $actual"
            echo "Merge the release-please PR (or bump version.txt) before packing."
            exit 1
          fi
      - uses: ./.github/actions/setup-android-ci
      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "Set KEYSTORE_BASE64 and KEYSTORE_PASSWORD (and optionally KEY_ALIAS / KEY_PASSWORD) as repository secrets."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["KEYSTORE_BASE64"]
          Path("release.jks").write_bytes(base64.b64decode(raw))
          alias = os.environ.get("KEY_ALIAS") or "burton"
          store = os.environ["KEYSTORE_PASSWORD"]
          key = os.environ.get("KEY_PASSWORD") or store
          Path("keystore.properties").write_text(
              "storeFile=release.jks\n"
              f"storePassword={store}\n"
              f"keyAlias={alias}\n"
              f"keyPassword={key}\n"
          )
          PY
      - name: Assemble signed release
        run: ./gradlew --no-daemon assembleRelease
      - name: Ensure GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          apk="burton-sonos-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$apk" --clobber
